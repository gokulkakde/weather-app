<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather Lookup</title>
    <style>
      :root {
        --bg: #0f1419;
        --panel: #1a2330;
        --text: #e8eef5;
        --muted: #8fa3b8;
        --accent: #5eb8ff;
        --border: #2a3a4d;
        --danger: #ff8a8a;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }

      [data-theme="light"] {
        --bg: #eef3f8;
        --panel: #ffffff;
        --text: #14202c;
        --muted: #5b6d7e;
        --accent: #0b6ec4;
        --border: #d5e0ea;
        --danger: #b42318;
        --shadow: 0 18px 40px rgba(20, 40, 70, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(1200px 500px at 10% -10%, rgba(94, 184, 255, 0.18), transparent 50%),
          var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .app {
        width: min(560px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 28px;
        box-shadow: var(--shadow);
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      .sub {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .toggles {
        display: flex;
        gap: 8px;
      }

      button,
      input {
        font: inherit;
      }

      .icon-btn {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
        cursor: pointer;
      }

      form {
        display: flex;
        gap: 8px;
      }

      input[type="search"] {
        flex: 1;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .primary {
        background: var(--accent);
        color: #061018;
        border: 0;
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 600;
        cursor: pointer;
      }

      [data-theme="light"] .primary {
        color: #fff;
      }

      .status {
        min-height: 1.4em;
        margin: 14px 0 0;
        color: var(--muted);
      }

      .status.error {
        color: var(--danger);
      }

      .card {
        display: none;
        margin-top: 18px;
        border-top: 1px solid var(--border);
        padding-top: 18px;
      }

      .place {
        font-size: 1.1rem;
        font-weight: 600;
      }

      .temp-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin: 8px 0 4px;
      }

      .temp {
        font-size: 3.4rem;
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      .condition {
        color: var(--muted);
        font-size: 1.05rem;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 18px;
      }

      .stat {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
      }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .stat strong {
        display: block;
        margin-top: 4px;
        font-size: 1.1rem;
      }

      footer {
        margin-top: 20px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      footer a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header>
        <div>
          <h1>Weather lookup</h1>
          <p class="sub">Search a city for the current conditions.</p>
        </div>
        <div class="toggles">
          <button class="icon-btn" id="unitBtn" type="button" aria-label="Toggle temperature unit">
            °C
          </button>
          <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme">
            Light
          </button>
        </div>
      </header>

      <form id="searchForm">
        <input
          id="city"
          type="search"
          name="city"
          placeholder="Try Chennai, London, Tokyo…"
          autocomplete="off"
          required
        />
        <button class="primary" type="submit">Look up</button>
      </form>

      <p class="status" id="status" role="status"></p>

      <section class="card" id="result" hidden>
        <div class="place" id="place"></div>
        <div class="temp-row">
          <div class="temp" id="temp"></div>
          <div class="condition" id="condition"></div>
        </div>
        <div class="grid">
          <div class="stat">
            <span>Feels like</span>
            <strong id="feels"></strong>
          </div>
          <div class="stat">
            <span>Humidity</span>
            <strong id="humidity"></strong>
          </div>
          <div class="stat">
            <span>Wind</span>
            <strong id="wind"></strong>
          </div>
          <div class="stat">
            <span>Updated</span>
            <strong id="updated"></strong>
          </div>
        </div>
      </section>

      <footer>
        Weather from
        <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a>
        (no API key). Open this file in a browser or run a local server.
      </footer>
    </main>

    <script>
      const GEOCODE = "https://geocoding-api.open-meteo.com/v1/search";
      const FORECAST = "https://api.open-meteo.com/v1/forecast";
      const WEATHER_CODES = {
        0: "Clear sky",
        1: "Mainly clear",
        2: "Partly cloudy",
        3: "Overcast",
        45: "Fog",
        48: "Rime fog",
        51: "Light drizzle",
        53: "Drizzle",
        55: "Dense drizzle",
        56: "Freezing drizzle",
        57: "Freezing drizzle",
        61: "Light rain",
        63: "Rain",
        65: "Heavy rain",
        66: "Freezing rain",
        67: "Freezing rain",
        71: "Light snow",
        73: "Snow",
        75: "Heavy snow",
        77: "Snow grains",
        80: "Rain showers",
        81: "Rain showers",
        82: "Violent rain showers",
        85: "Snow showers",
        86: "Heavy snow showers",
        95: "Thunderstorm",
        96: "Thunderstorm with hail",
        99: "Thunderstorm with hail",
      };

      const form = document.getElementById("searchForm");
      const cityInput = document.getElementById("city");
      const statusEl = document.getElementById("status");
      const resultEl = document.getElementById("result");
      const unitBtn = document.getElementById("unitBtn");
      const themeBtn = document.getElementById("themeBtn");

      let useFahrenheit = false;
      let lastWeather = null;

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle("error", isError);
      }

      function toF(celsius) {
        return (celsius * 9) / 5 + 32;
      }

      function formatTemp(celsius) {
        const value = useFahrenheit ? toF(celsius) : celsius;
        const unit = useFahrenheit ? "°F" : "°C";
        return `${Math.round(value)}${unit}`;
      }

      function formatTime(iso) {
        try {
          return new Intl.DateTimeFormat(undefined, {
            hour: "numeric",
            minute: "2-digit",
          }).format(new Date(iso));
        } catch {
          return iso;
        }
      }

      function render(weather) {
        document.getElementById("place").textContent = weather.label;
        document.getElementById("temp").textContent = formatTemp(weather.temperature);
        document.getElementById("condition").textContent = weather.condition;
        document.getElementById("feels").textContent = formatTemp(weather.feelsLike);
        document.getElementById("humidity").textContent = `${weather.humidity}%`;
        document.getElementById("wind").textContent = `${Math.round(weather.wind)} km/h`;
        document.getElementById("updated").textContent = formatTime(weather.time);
        resultEl.hidden = false;
        resultEl.style.display = "block";
      }

      async function lookup(city) {
        setStatus("Finding that city…");
        resultEl.hidden = true;
        resultEl.style.display = "none";

        const geoUrl = `${GEOCODE}?name=${encodeURIComponent(city)}&count=1&language=en`;
        const geoRes = await fetch(geoUrl);
        if (!geoRes.ok) throw new Error("Could not reach the geocoding service.");
        const geo = await geoRes.json();
        const place = geo.results && geo.results[0];
        if (!place) throw new Error("No city found with that name. Try a nearby city.");

        const forecastUrl =
          `${FORECAST}?latitude=${place.latitude}&longitude=${place.longitude}` +
          "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m" +
          "&timezone=auto";
        const weatherRes = await fetch(forecastUrl);
        if (!weatherRes.ok) throw new Error("Could not reach the forecast service.");
        const data = await weatherRes.json();
        const current = data.current;
        if (!current) throw new Error("Forecast did not include current weather.");

        const admin = [place.admin1, place.country].filter(Boolean).join(", ");
        lastWeather = {
          label: admin ? `${place.name} · ${admin}` : place.name,
          temperature: current.temperature_2m,
          feelsLike: current.apparent_temperature,
          humidity: current.relative_humidity_2m,
          wind: current.wind_speed_10m,
          condition: WEATHER_CODES[current.weather_code] || `Code ${current.weather_code}`,
          time: current.time,
        };

        render(lastWeather);
        setStatus("Here’s the latest reading.");
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const city = cityInput.value.trim();
        if (!city) return;
        try {
          await lookup(city);
        } catch (error) {
          lastWeather = null;
          setStatus(error.message || "Something went wrong.", true);
        }
      });

      unitBtn.addEventListener("click", () => {
        useFahrenheit = !useFahrenheit;
        unitBtn.textContent = useFahrenheit ? "°F" : "°C";
        if (lastWeather) render(lastWeather);
      });

      themeBtn.addEventListener("click", () => {
        const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
        if (next === "light") document.documentElement.dataset.theme = "light";
        else delete document.documentElement.dataset.theme;
        themeBtn.textContent = next === "light" ? "Dark" : "Light";
      });
    </script>
  </body>
</html>
